[project]
name = "passtally"
version = "0.1.0"
description = "Headless rules engine for a Passtally-like tile game"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["passtally*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
